name: quality
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  service:
    runs-on: native
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: nix flake check
      - run: nix fmt -- --check flake.nix package.nix module.nix
